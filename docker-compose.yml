version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: telcosur-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: telcosur
      POSTGRES_PASSWORD: telcosur_dev_2026
      POSTGRES_DB: telcosur_ot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - telcosur-network

networks:
  telcosur-network:
    driver: bridge

volumes:
  postgres_data:
