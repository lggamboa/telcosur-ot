<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TelcoSur - App del Técnico</title>
    <style>
        body { font-family: Arial; margin: 0; padding: 0; width: 375px; margin: auto; }
        .header { background: #006C5B; color: white; padding: 15px; text-align: center; }
        .card { border: 1px solid #ccc; padding: 15px; margin: 10px; border-radius: 8px; }
        .btn-primary { background: #009681; color: white; padding: 10px; width: 100%; border: none; border-radius: 5px; margin-top: 10px; }
        .btn-secondary { background: #63666A; color: white; padding: 10px; width: 100%; border: none; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Mi OT</h2>
    </div>
    <div class="card">
        <h3>OT-045</h3>
        <p>Sitio: RB-102</p>
        <p>Repuesto: Cable</p>
        <button class="btn-primary">Reportar Avance</button>
        <button class="btn-secondary">Cerrar OT</button>
    </div>
</body>
</html>
